name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/hialtdev/hialt-recall

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3

      - name: Configure kubeconfig
        env:
          KUBECONFIG_STABLE_CI: ${{ secrets.KUBECONFIG_STABLE_CI }}
        run: |
          mkdir -p ~/.kube
          umask 077
          printf '%s' "$KUBECONFIG_STABLE_CI" | base64 -d > ~/.kube/config

      - name: Deploy to k3s
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Deploy this build's immutable digest, even if latest moves later.
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid build image digest" >&2; exit 1; }
          RELEASE_IMAGE="${IMAGE_NAME}@${IMAGE_DIGEST}"
          ./scripts/deploy-kubernetes-image.sh hialt-recall "$RELEASE_IMAGE"
