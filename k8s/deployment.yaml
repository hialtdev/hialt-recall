apiVersion: apps/v1
kind: Deployment
metadata:
  name: hialt-recall-ui
  namespace: hialt-recall
  labels:
    app: hialt-recall-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hialt-recall-ui
  template:
    metadata:
      labels:
        app: hialt-recall-ui
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ui
          image: ghcr.io/hialtdev/hialt-recall:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: hialt-recall-config
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hialt-recall-secrets
                  key: groq-api-key
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: hialt-recall-secrets
                  key: mongodb-uri
          readinessProbe:
            httpGet:
              # Streamlit's built-in health endpoint. There is no bare
              # /healthz route (that was 404ing, so this pod likely never
              # reported Ready and never received Service/Ingress traffic).
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hialt-recall-consumer
  namespace: hialt-recall
  labels:
    app: hialt-recall-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hialt-recall-consumer
  template:
    metadata:
      labels:
        app: hialt-recall-consumer
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: consumer
          image: ghcr.io/hialtdev/hialt-recall:latest
          imagePullPolicy: Always
          command: ["python", "src/rag_consumer.py"]
          envFrom:
            - configMapRef:
                name: hialt-recall-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: hialt-recall-secrets
                  key: mongodb-uri
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"