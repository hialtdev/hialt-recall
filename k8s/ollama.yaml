# ── Persistent Volume (model weights) ────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-models-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /usr/share/ollama/.ollama/models
    type: Directory
---
# ── Persistent Volume Claim ───────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: hialt-recall
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: ollama-models-pv
  resources:
    requests:
      storage: 20Gi
---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: hialt-recall
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      securityContext:
        runAsUser: 997
        runAsGroup: 986
        fsGroup: 986
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 11434
          env:
            - name: HOME
              value: /home/ollama
            - name: OLLAMA_HOME    # writable dir for keys/config
              value: /home/ollama
            - name: OLLAMA_MODELS  # read-only model weights
              value: /models
          volumeMounts:
            - name: ollama-home    # writable home for keys/config
              mountPath: /home/ollama
            - name: models         # model weights from host
              mountPath: /models
          resources:
            requests:
              memory: "4Gi"
              cpu: "200m"
            limits:
              memory: "12Gi"
              cpu: "4000m"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: ollama-home        # backed by host dir owned by uid 997
          hostPath:
            path: /var/lib/ollama-k8s
            type: Directory
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: hialt-recall
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434