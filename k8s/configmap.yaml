apiVersion: v1
kind: ConfigMap
metadata:
  name: hialt-recall-config
  namespace: hialt-recall
data:
  # ── Kafka ─────────────────────────────────────────────────────────────────
  KAFKA_BOOTSTRAP_SERVERS: "bitbybit-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "hialt-recall-chunks"
  KAFKA_CONSUMER_GROUP: "hialt-recall-workers"
  # ── Ollama (in-cluster) ───────────────────────────────────────────────────
  OLLAMA_BASE_URL: "http://ollama-service.hialt-recall.svc.cluster.local:11434"
  OLLAMA_EMBEDDING_MODEL: "mxbai-embed-large"
  OLLAMA_LLM_MODEL: "llama3"
  # ── Postgres / pgvector (shared cluster instance) ──────────────────────────
  # POSTGRES_URI itself lives in the hialt-recall-secrets Secret (key
  # postgres-uri), same pattern the old mongodb-uri key used — it carries
  # hialt-recall's own database + role on the shared instance, not the
  # instance's admin credentials.
  EMBEDDING_DIM: "1024"
  POSTGRES_TABLE: "chunks"
  POSTGRES_FAILED_TABLE: "chunks_failed"
  # ── LLM ───────────────────────────────────────────────────────────────────
  LLM_TEMPERATURE: "0.2"
  GROQ_MODEL: "openai/gpt-oss-120b"
