apiVersion: v1
kind: ServiceAccount
metadata:
  name: hialt-recall-ci
  namespace: hialt-recall
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: hialt-recall-ci-token-binding
  namespace: hialt-recall
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hialt-recall-ci
  namespace: hialt-recall
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [hialt-recall-ui, hialt-recall-consumer]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hialt-recall-ci
  namespace: hialt-recall
subjects:
  - kind: ServiceAccount
    name: hialt-recall-ci
    namespace: hialt-recall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hialt-recall-ci
